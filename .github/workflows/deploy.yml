name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main  # Change if you use 'master' or another branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to Azure Container Registry
      run: |
        echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | docker login ${{ secrets.AZURE_REGISTRY }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.AZURE_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
