name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main  # change this if you use a different branch name

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Log in to Azure Container Registry
      run: |
        echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | \
        docker login ${{ secrets.AZURE_REGISTRY }} \
        -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.AZURE_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
